[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-sentinel"
version = "0.1.0"
description = "QA Sentinel structured domain contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "SQLAlchemy>=2,<3", "Alembic>=1,<2", "openai>=2.54,<3", "fastapi>=0.135.2,<0.136"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
